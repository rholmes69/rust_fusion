[workspace]
resolver = "2"
members = ["crates/kernel", "crates/model", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earcutr = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
